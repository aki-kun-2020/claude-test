name: Tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: python -m pytest test_calculator.py -v --junit-xml=test-results.xml -o "junit_suite_name=calculator"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

      - name: Test Checklist
        if: always()
        run: |
          python - <<'PYEOF'
          import ast
          import os
          import xml.etree.ElementTree as ET

          # テストファイルからdocstringを抽出
          docstrings = {}
          for source_file in ["test_calculator.py"]:
              with open(source_file) as f:
                  tree_ast = ast.parse(f.read())
              for node in ast.walk(tree_ast):
                  if isinstance(node, ast.FunctionDef) and node.name.startswith("test_"):
                      doc = ast.get_docstring(node)
                      if doc:
                          docstrings[node.name] = doc

          # JUnit XMLを解析
          tree = ET.parse("test-results.xml")
          suite = tree.find(".//testsuite")
          total = suite.get("tests", "0")
          failures = suite.get("failures", "0")
          errors = suite.get("errors", "0")
          passed = int(total) - int(failures) - int(errors)

          py_version = "${{ matrix.python-version }}"
          lines = []
          lines.append(f"## Test Results (Python {py_version})")
          lines.append(f"**{passed} passed** / {failures} failed / {total} total")
          lines.append("")

          current_class = ""
          for tc in tree.iter("testcase"):
              cls = tc.get("classname", "")
              name = tc.get("name", "")
              failure = tc.find("failure")
              error = tc.find("error")
              desc = docstrings.get(name, "")

              if cls != current_class:
                  current_class = cls
                  lines.append(f"### {cls}")

              label = f"`{name}`"
              if desc:
                  label += f" — {desc}"

              if failure is not None:
                  msg = failure.get("message", "")
                  lines.append(f"- [ ] :x: {label}")
                  if msg:
                      lines.append(f"  > {msg}")
              elif error is not None:
                  msg = error.get("message", "")
                  lines.append(f"- [ ] :warning: {label}")
                  if msg:
                      lines.append(f"  > {msg}")
              else:
                  lines.append(f"- [x] {label}")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")
          with open(summary_path, "a") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF
